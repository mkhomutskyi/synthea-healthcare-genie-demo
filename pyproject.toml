[project]
name = "synthea-healthcare-genie-demo"
version = "0.1.0"
description = "Reproducible healthcare operations Genie Agent demo built from a public Synthea synthetic sample (upstream 100-patient sample label)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Maks Khomutskyi" }]
dependencies = ["pyyaml>=6.0.2"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
build-constraint-dependencies = ["hatchling==1.32.4"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/synthea_genie_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not artifact and not databricks'"
markers = [
    "artifact: needs the verified Synthea archive in .cache (artifact integration tier; never in default CI)",
    "databricks: needs a live Databricks workspace (Databricks integration tier; never in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
mypy_path = "src"
